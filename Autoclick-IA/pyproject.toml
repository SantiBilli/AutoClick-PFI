[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autoclick-ia"
version = "0.1.0"
description = "Local AI service for AutoClick"
requires-python = ">=3.11,<3.12"
dependencies = [
  "autoclick-mcp>=0.1,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "json-repair>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  "regex>=2024.11,<2027",
  "uvicorn[standard]>=0.32,<1",
  "boto3>=1.43.103,<2",
]

[tool.uv.sources]
autoclick-mcp = { path = "../Autoclick-MCP", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["app"]
